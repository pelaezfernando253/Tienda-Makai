<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Makai – Joyería y Accesorios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary: #111; --accent: #E6005C; --whatsapp: #25D366; --edit: #007bff; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #fff; color: #111; }
        header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; }
        header h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 1.8rem; letter-spacing: 2px; }
        .banner { height: 350px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=2070&auto=format&fit=crop') center/cover; display: flex; justify-content: center; align-items: center; color: white; text-align: center; }
        .container { padding: 2.5rem 1.5rem; max-width: 1200px; margin: auto; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2.5rem; }
        .card { background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #f0f0f0; display: flex; flex-direction: column; transition: 0.3s; }
        .card img { width: 100%; height: 320px; object-fit: cover; }
        .info { text-align: center; padding: 1.5rem; flex-grow: 1; }
        .price { color: var(--accent); font-weight: 700; font-size: 1.3rem; margin-bottom: 15px; }
        .btn-add { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        
        /* BOTONES DE ADMINISTRACIÓN */
        .admin-controls { display: flex; flex-direction: column; gap: 5px; padding: 10px; background: #f9f9f9; border-top: 1px solid #eee; }
        .del-btn { background: #ff4d4d; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .edit-btn { background: var(--edit); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2rem; border-radius: 20px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; border-radius: 10px; margin-bottom: 1rem; border: 1px solid #ddd; outline: none; box-sizing: border-box; }
        .cart-float { position: fixed; bottom: 25px; right: 25px; background: var(--whatsapp); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<header>
    <h1>Makai</h1>
    <button style="background:#eee; border:none; padding:5px 15px; border-radius:20px; cursor:pointer;" onclick="verificarAdmin()">Admin</button>
</header>

<div class="banner">
    <h2 style="font-family:'Playfair Display'; font-size:2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">Elegancia en cada detalle</h2>
</div>

<div class="container">
    <div id="gallery" class="gallery"></div>
</div>

<div class="cart-float" onclick="abrirCarrito()">🛒 <span id="cartCount" style="font-size:12px; background:red; padding:2px 6px; border-radius:50%; position:absolute; top:5px; right:5px;">0</span></div>

<div id="adminPanel" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Nuevo Producto</h3>
        <input id="p_id" type="hidden"> <input id="p_img" placeholder="URL de la imagen (Ej: de ImgBB)">
        <input id="p_name" placeholder="Nombre del producto">
        <input id="p_price" type="number" placeholder="Precio ($)">
        <button class="btn-add" onclick="guardarCambios()">Guardar en la Nube</button>
        <button style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer; color:gray;" onclick="cerrarModal()">Cancelar</button>
    </div>
</div>

<script>
    // Configuración de tu proyecto Makai
    const firebaseConfig = {
        apiKey: "AIzaSyCsPFIJZ5tREVjBIJCLEdad1rVKkQlx9Qo",
        authDomain: "makai-3809b.firebaseapp.com",
        databaseURL: "https://makai-3809b-default-rtdb.firebaseio.com",
        projectId: "makai-3809b",
        storageBucket: "makai-3809b.firebasestorage.app",
        messagingSenderId: "95115227741",
        appId: "1:95115227741:web:ae5644751ced382a4453b4"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let carrito = [];

    // Función para mostrar los productos
    db.ref('productos').on('value', (snapshot) => {
        const data = snapshot.val();
        const gal = document.getElementById('gallery');
        gal.innerHTML = '';
        const esAdmin = localStorage.getItem('makaiAdmin') === 'true';

        for (let id in data) {
            const p = data[id];
            gal.innerHTML += `
                <div class="card">
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300?text=Error+en+Imagen'">
                    <div class="info">
                        <h4>${p.name}</h4>
                        <div class="price">$${parseFloat(p.price).toFixed(2)}</div>
                        <button class="btn-add" onclick="agregarAlCarrito('${p.name}', ${p.price})">Comprar ahora</button>
                    </div>
                    ${esAdmin ? `
                        <div class="admin-controls">
                            <button class="edit-btn" onclick="abrirEdicion('${id}', '${p.name}', '${p.price}', '${p.img}')">✎ Editar Datos</button>
                            <button class="del-btn" onclick="eliminarProducto('${id}')">🗑 Borrar</button>
                        </div>` : ''}
                </div>`;
        }
    });

    // Función que decide si CREA un producto nuevo o EDITA uno existente
    function guardarCambios() {
        const id = document.getElementById('p_id').value;
        const nuevoProducto = {
            img: document.getElementById('p_img').value,
            name: document.getElementById('p_name').value,
            price: document.getElementById('p_price').value
        };

        if(!nuevoProducto.name || !nuevoProducto.img || !nuevoProducto.price) {
            return alert("Por favor completa todos los campos.");
        }

        if(id) {
            // Si hay un ID, editamos el existente
            db.ref('productos/' + id).set(nuevoProducto)
                .then(() => alert("¡Producto actualizado!"));
        } else {
            // Si no hay ID, creamos uno nuevo
            db.ref('productos').push(nuevoProducto)
                .then(() => alert("¡Producto guardado!"));
        }
        cerrarModal();
    }

    // Prepara el cuadro para editar
    function abrirEdicion(id, nombre, precio, imagen) {
        document.getElementById('modalTitle').innerText = "Editar Joya";
        document.getElementById('p_id').value = id;
        document.getElementById('p_name').value = nombre;
        document.getElementById('p_price').value = precio;
        document.getElementById('p_img').value = imagen;
        document.getElementById('adminPanel').classList.add('active');
    }

    function eliminarProducto(id) {
        if(confirm("¿Estás segura de eliminar esta pieza de Makai?")) {
            db.ref('productos/' + id).remove();
        }
    }

    function verificarAdmin() {
        if(localStorage.getItem('makaiAdmin') === 'true') {
            document.getElementById('modalTitle').innerText = "Nuevo Producto";
            document.getElementById('p_id').value = '';
            document.getElementById('p_img').value = '';
            document.getElementById('p_name').value = '';
            document.getElementById('p_price').value = '';
            document.getElementById('adminPanel').classList.add('active');
        } else {
            if(prompt("Clave de Administrador:") === "Makai") {
                localStorage.setItem('makaiAdmin', 'true');
                location.reload();
            }
        }
    }

    function cerrarModal() { document.getElementById('adminPanel').classList.remove('active'); }

    function agregarAlCarrito(n, p) {
        carrito.push({n, p});
        document.getElementById('cartCount').innerText = carrito.length;
    }

    function abrirCarrito() {
        if(carrito.length === 0) return alert("El carrito está vacío.");
        let texto = "¡Hola Makai! ✨ Me encantaron estos modelos:\n\n";
        let total = 0;
        carrito.forEach(i => {
            texto += `- ${i.n} ($${i.p})\n`;
            total += parseFloat(i.p);
        });
        texto += `\n*Total: $${total.toFixed(2)}*`;
        window.open(`https://wa.me/584123580010?text=${encodeURIComponent(texto)}`, '_blank');
    }
</script>
</body>
</html>
