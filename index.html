<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Makai – Joyería y Accesorios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary: #111; --accent: #E6005C; --whatsapp: #25D366; --edit: #007bff; --danger: #dc3545; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #fff; }
        
        header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0.8rem 1.5rem; gap: 15px; }
        header h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 1.5rem; }
        .header-search { flex-grow: 1; display: flex; justify-content: center; }
        .search-input { width: 100%; max-width: 350px; padding: 8px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 0.9rem; }

        .banner { height: 160px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=2070&auto=format&fit=crop') center/cover; display: flex; justify-content: center; align-items: center; color: white; text-align: center; }
        .container { padding: 1.5rem; max-width: 1200px; margin: auto; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        
        .card { background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #eee; position: relative; display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        
        /* ETIQUETA DE DESCUENTO */
        .badge-discount { position: absolute; top: 12px; left: 12px; background: var(--accent); color: white; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .info { padding: 1.2rem; text-align: center; flex-grow: 1; }
        .info h4 { margin: 0 0 8px 0; font-size: 1.1rem; color: #333; }
        
        /* PRECIOS */
        .price-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; }
        .price-old { text-decoration: line-through; color: #a0a0a0; font-size: 0.95rem; }
        .price-new { color: var(--accent); font-weight: 700; font-size: 1.35rem; }
        .price-regular { color: #111; font-weight: 600; font-size: 1.2rem; }

        .btn-add { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-add:active { transform: scale(0.96); }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 1.5rem; border-radius: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.95rem; }
        .remove-btn { color: var(--danger); cursor: pointer; border: 1.5px solid var(--danger); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }

        .cart-float { position: fixed; bottom: 25px; right: 25px; background: var(--whatsapp); color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 2000; }
        #cartCount { font-size: 12px; background: red; color: white; padding: 2px 7px; border-radius: 50%; position: absolute; top: 5px; right: 5px; border: 2px solid white; font-weight: bold; }

        .drop-zone { border: 2px dashed #ccc; padding: 20px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 15px; background: #fafafa; }
        #imgPreview { width: 100%; max-height: 150px; object-fit: contain; display: none; margin-top: 10px; border-radius: 8px; }
        .admin-controls { display: flex; gap: 8px; padding: 10px; background: #f4f4f4; }
        .admin-controls button { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 0.8rem; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <h1>Makai</h1>
    <div class="header-search"><input type="text" id="searchInput" class="search-input" placeholder="¿Qué joya buscas?" onkeyup="filtrarProductos()"></div>
    <button onclick="verificarAdmin()" style="background:#eee; border:none; padding:8px 15px; border-radius:20px; cursor:pointer; font-size:0.8rem;">Admin</button>
</header>

<div class="banner"><h2>Brilla con piezas únicas</h2></div>
<div class="container"><div id="gallery" class="gallery"></div></div>

<div class="cart-float" onclick="abrirModalCarrito()">
    🛒 <span id="cartCount">0</span>
</div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">Tu Carrito ✨</h3>
        <div id="cartList"></div>
        <div id="cartTotal" style="margin: 20px 0; font-weight: bold; font-size: 1.2rem; text-align: right; border-top: 2px solid #eee; padding-top: 10px;"></div>
        <button class="btn-add" style="background: var(--whatsapp); height: 50px;" onclick="enviarWhatsApp()">Confirmar Pedido</button>
        <button style="width:100%; border:none; background:none; cursor:pointer; color:gray; margin-top:15px;" onclick="cerrarModalCarrito()">Seguir comprando</button>
    </div>
</div>

<div id="adminPanel" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Nueva Joya</h3>
        <input id="p_id" type="hidden">
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()" ondragover="event.preventDefault()" ondrop="manejarDrop(event)">
            <p id="dropText">Arrastra la foto aquí o toca para subir</p>
            <img id="imgPreview">
            <input type="file" id="fileInput" hidden accept="image/*" onchange="convertirImagen(this.files[0])">
        </div>
        <input id="p_img_url" type="hidden">
        <input id="p_name" placeholder="Nombre de la pieza">
        <input id="p_price" type="number" placeholder="Precio Original $">
        <input id="p_sale" type="number" placeholder="Precio con Descuento $ (Opcional)">
        <button class="btn-add" onclick="guardarProducto()">Guardar Cambios</button>
        <button style="width:100%; border:none; background:none; cursor:pointer; margin-top:12px;" onclick="cerrarModal()">Cancelar</button>
        <hr style="margin: 20px 0; opacity: 0.3;">
        <button onclick="cerrarSesion()" style="width:100%; padding:10px; background:var(--danger); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold;">CERRAR SESIÓN ADMIN</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCsPFIJZ5tREVjBIJCLEdad1rVKkQlx9Qo",
        authDomain: "makai-3809b.firebaseapp.com",
        databaseURL: "https://makai-3809b-default-rtdb.firebaseio.com",
        projectId: "makai-3809b",
        storageBucket: "makai-3809b.firebasestorage.app",
        messagingSenderId: "95115227741",
        appId: "1:95115227741:web:ae5644751ced382a4453b4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let productosLocales = [];
    let carrito = [];

    function convertirImagen(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
            document.getElementById('p_img_url').value = reader.result;
            const pre = document.getElementById('imgPreview');
            pre.src = reader.result; pre.style.display = 'block';
            document.getElementById('dropText').style.display = 'none';
        }
        reader.readAsDataURL(file);
    }
    function manejarDrop(e) { e.preventDefault(); convertirImagen(e.dataTransfer.files[0]); }

    db.ref('productos').on('value', (snap) => {
        const data = snap.val();
        productosLocales = [];
        for (let id in data) productosLocales.push({ id, ...data[id] });
        renderGaleria(productosLocales);
    });

    function renderGaleria(productos) {
        const gal = document.getElementById('gallery');
        gal.innerHTML = '';
        const admin = localStorage.getItem('makaiAdmin') === 'true';
        productos.forEach(p => {
            const tieneOferta = p.sale && parseFloat(p.sale) < parseFloat(p.price);
            const precioAMostrar = tieneOferta ? p.sale : p.price;
            
            gal.innerHTML += `
                <div class="card">
                    ${tieneOferta ? `<div class="badge-discount">OFERTA</div>` : ''}
                    <img src="${p.img}">
                    <div class="info">
                        <h4>${p.name}</h4>
                        <div class="price-container">
                            ${tieneOferta 
                                ? `<span class="price-old">$${p.price}</span><span class="price-new">$${p.sale}</span>` 
                                : `<span class="price-regular">$${p.price}</span>`
                            }
                        </div>
                        <button class="btn-add" onclick="agregarAlCarrito('${p.name}', ${precioAMostrar})">Añadir al carrito</button>
                    </div>
                    ${admin ? `
                        <div class="admin-controls">
                            <button onclick="prepararEdicion('${p.id}','${p.name}','${p.price}','${p.img}','${p.sale||''}')" style="background:var(--edit)">Editar</button>
                            <button onclick="eliminar('${p.id}')" style="background:var(--danger)">Borrar</button>
                        </div>` : ''}
                </div>`;
        });
    }

    function filtrarProductos() {
        const t = document.getElementById('searchInput').value.toLowerCase();
        renderGaleria(productosLocales.filter(p => p.name.toLowerCase().includes(t)));
    }

    function agregarAlCarrito(n, p) { carrito.push({n, p}); document.getElementById('cartCount').innerText = carrito.length; }
    
    function abrirModalCarrito() {
        const list = document.getElementById('cartList');
        const tot = document.getElementById('cartTotal');
        list.innerHTML = ''; let t = 0;
        if(carrito.length === 0) list.innerHTML = "<p style='text-align:center;'>El carrito está vacío ☹️</p>";
        else {
            carrito.forEach((i, idx) => {
                t += parseFloat(i.p);
                list.innerHTML += `<div class="cart-item"><span>${i.n} - <b>$${i.p}</b></span><span class="remove-btn" onclick="quitar(${idx})">Eliminar</span></div>`;
            });
            tot.innerText = "Total: $" + t.toFixed(2);
        }
        document.getElementById('cartModal').classList.add('active');
    }

    function quitar(idx) { carrito.splice(idx, 1); document.getElementById('cartCount').innerText = carrito.length; abrirModalCarrito(); }

    function enviarWhatsApp() {
        if(carrito.length === 0) return;
        let m = "¡Hola Makai! ✨ Quiero realizar un pedido:\n\n";
        let t = 0;
        carrito.forEach(i => { m += `• ${i.n} ($${i.p})\n`; t += parseFloat(i.p); });
        m += `\n*Total estimado: $${t.toFixed(2)}*`;
        window.open(`https://wa.me/584123580010?text=${encodeURIComponent(m)}`);
    }

    function guardarProducto() {
        const id = document.getElementById('p_id').value;
        const p = { img: document.getElementById('p_img_url').value, name: document.getElementById('p_name').value, price: document.getElementById('p_price').value, sale: document.getElementById('p_sale').value };
        if(!p.name || !p.img) return alert("Por favor completa los campos");
        if(id) db.ref('productos/' + id).set(p); else db.ref('productos').push(p);
        cerrarModal();
    }

    function prepararEdicion(id, n, p, i, s) {
        document.getElementById('p_id').value = id; document.getElementById('p_name').value = n; 
        document.getElementById('p_price').value = p; document.getElementById('p_img_url').value = i; 
        document.getElementById('p_sale').value = s;
        document.getElementById('imgPreview').src = i; document.getElementById('imgPreview').style.display='block';
        document.getElementById('dropText').style.display='none';
        document.getElementById('adminPanel').classList.add('active');
    }

    function cerrarModal() { document.getElementById('adminPanel').classList.remove('active'); document.getElementById('p_id').value=''; document.getElementById('imgPreview').style.display='none'; document.getElementById('dropText').style.display='block'; }
    function cerrarModalCarrito() { document.getElementById('cartModal').classList.remove('active'); }
    function verificarAdmin() {
        if(localStorage.getItem('makaiAdmin') === 'true') document.getElementById('adminPanel').classList.add('active');
        else if(prompt("Clave de acceso:") === "Makai") { localStorage.setItem('makaiAdmin', 'true'); location.reload(); }
    }
    function eliminar(id) { if(confirm("¿Seguro que quieres borrar este producto?")) db.ref('productos/' + id).remove(); }
    function cerrarSesion() { localStorage.removeItem('makaiAdmin'); location.reload(); }
</script>
</body>
</html>
