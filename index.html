<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Tienda Makai – Bisutería</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #111;
            --accent: #E6005C;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #fff;
            color: #111;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
        }

        .admin-btn {
            background: #111;
            color: #fff;
            border: none;
            padding: .4rem .9rem;
            border-radius: 20px;
            cursor: pointer;
        }

        .banner {
            height: 55vh;
            background: url('https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .banner h2 {
            background: rgba(255,255,255,.85);
            padding: 1.2rem 2rem;
            border-radius: 14px;
        }

        .container { padding: 2rem; max-width: 1300px; margin: auto; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .card {
            border-radius: 18px;
            overflow: hidden;
            transition: .25s;
            border: 1px solid #eee;
        }

        .card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,.12); }
        .card img { width: 100%; height: 320px; object-fit: cover; }

        .info { text-align: center; padding: 1rem; }
        .price-old { text-decoration: line-through; color: #999; font-size: 0.9rem; }
        .price-new { color: var(--accent); font-weight: 600; font-size: 1.1rem; }

        .hidden { display: none !important; }

        .admin-panel {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .admin-box {
            background: #fff;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .admin-box input {
            width: 100%;
            margin-bottom: 1rem;
            padding: .8rem;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn-dark { background: #111; color: #fff; border: none; padding: .8rem; cursor: pointer; width: 100%; border-radius: 8px; margin-bottom: 0.5rem; }
        .btn-light { background: #eee; color: #333; border: none; padding: .8rem; cursor: pointer; width: 100%; border-radius: 8px; }

        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        @media(max-width:768px){ .banner{height:40vh} }
    </style>
</head>
<body>

<header>
    <h1>Makai Jewelry</h1>
    <button class="admin-btn" onclick="openLogin()">Admin</button>
</header>

<section class="banner">
    <h2>Nueva Colección ✨</h2>
</section>

<div class="container">
    <div id="gallery" class="gallery"></div>
</div>

<div id="login" class="admin-panel hidden">
    <div class="admin-box">
        <h3>Acceso Administrador</h3>
        <input id="adminUser" type="text" placeholder="Usuario">
        <input id="adminPass" type="password" placeholder="Contraseña">
        <button class="btn-dark" onclick="loginAdmin()">Entrar</button>
        <button class="btn-light" onclick="closeLogin()">Cancelar</button>
    </div>
</div>

<div id="admin" class="admin-panel hidden">
    <div class="admin-box">
        <h3>Panel de Control</h3>
        <input id="p_img" placeholder="URL de la imagen">
        <input id="p_name" placeholder="Nombre del producto">
        <input id="p_price" type="number" placeholder="Precio">
        <input id="p_discount" type="number" placeholder="Descuento % (opcional)">
        <button class="btn-dark" onclick="addProduct()">Guardar Producto</button>
        <button class="btn-light" onclick="logoutAdmin()">Cerrar Sesión</button>
        <button class="btn-light" style="margin-top:10px" onclick="closeAdminPanel()">Cerrar Ventana</button>
    </div>
</div>

<script>
    const ADMIN_USER = 'Camila';
    const ADMIN_PASS = 'Makai';

    let products = JSON.parse(localStorage.getItem('products')) || [];

    // Función para renderizar la galería
    function render() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        const isAdmin = localStorage.getItem('adminLogged') === 'true';

        products.forEach((p, index) => {
            const price = parseFloat(p.price);
            const discount = parseFloat(p.discount) || 0;
            
            let priceHTML = discount > 0 
                ? `<div class="price-old">$${price.toFixed(2)}</div>
                   <div class="price-new">$${(price * (1 - discount / 100)).toFixed(2)} (-${discount}%)</div>`
                : `<div class="price-new">$${price.toFixed(2)}</div>`;

            gallery.innerHTML += `
                <div class="card">
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300?text=Imagen+No+Disponible'">
                    <div class="info">
                        <h4>${p.name}</h4>
                        ${priceHTML}
                        ${isAdmin ? `<button class="delete-btn" onclick="deleteProduct(${index})">Eliminar</button>` : ''}
                    </div>
                </div>`;
        });
    }

    // Funciones de Login
    function openLogin() {
        if (localStorage.getItem('adminLogged') === 'true') {
            document.getElementById('admin').classList.remove('hidden');
        } else {
            document.getElementById('login').classList.remove('hidden');
        }
    }

    function closeLogin() { document.getElementById('login').classList.add('hidden'); }
    function closeAdminPanel() { document.getElementById('admin').classList.add('hidden'); }

    function loginAdmin() {
        const u = document.getElementById('adminUser').value;
        const p = document.getElementById('adminPass').value;
        if(u === ADMIN_USER && p === ADMIN_PASS) {
            localStorage.setItem('adminLogged', 'true');
            closeLogin();
            document.getElementById('admin').classList.remove('hidden');
            render();
        } else {
            alert('Usuario o contraseña incorrectos');
        }
    }

    function logoutAdmin() {
        localStorage.removeItem('adminLogged');
        document.getElementById('admin').classList.add('hidden');
        render();
    }

    // Funciones de Productos
    function addProduct() {
        const img = document.getElementById('p_img').value;
        const name = document.getElementById('p_name').value;
        const price = document.getElementById('p_price').value;
        const discount = document.getElementById('p_discount').value || 0;

        if(!img || !name || !price) {
            alert("Por favor, completa los campos principales (Imagen, Nombre y Precio)");
            return;
        }

        products.push({ img, name, price, discount });
        localStorage.setItem('products', JSON.stringify(products));
        
        // Limpiar campos
        document.getElementById('p_img').value = '';
        document.getElementById('p_name').value = '';
        document.getElementById('p_price').value = '';
        document.getElementById('p_discount').value = '';

        render();
        alert("Producto agregado con éxito");
    }

    function deleteProduct(index) {
        if(confirm("¿Estás seguro de que quieres eliminar este producto?")) {
            products.splice(index, 1);
            localStorage.setItem('products', JSON.stringify(products));
            render();
        }
    }

    // Al cargar la página
    window.onload = () => {
        render();
    }
</script>

</body>
</html>
