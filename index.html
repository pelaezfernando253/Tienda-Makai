<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Makai – Joyería y Accesorios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary: #111; --accent: #E6005C; --whatsapp: #25D366; --edit: #007bff; --danger: #dc3545; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #fff; color: #111; }
        header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; }
        header h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 1.8rem; letter-spacing: 2px; }
        .banner { height: 250px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=2070&auto=format&fit=crop') center/cover; display: flex; justify-content: center; align-items: center; color: white; text-align: center; }
        .container { padding: 2rem; max-width: 1200px; margin: auto; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .card { background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #eee; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 320px; object-fit: cover; background: #f9f9f9; }
        .info { padding: 1.2rem; text-align: center; flex-grow: 1; }
        .price { color: var(--accent); font-weight: 700; font-size: 1.3rem; margin-bottom: 10px; }
        .btn-add { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        
        /* Controles de Administrador */
        .admin-controls { display: flex; flex-direction: column; gap: 5px; padding: 10px; background: #f8f8f8; }
        .del-btn { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .edit-btn { background: var(--edit); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Modal y Formularios */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2rem; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-logout { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 8px; width: 100%; border-radius: 10px; cursor: pointer; margin-top: 15px; font-weight: 600; }
        .btn-logout:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>

<header>
    <h1>Makai</h1>
    <button style="background:#eee; border:none; padding:8px 15px; border-radius:20px; cursor:pointer;" onclick="verificarAdmin()">Admin</button>
</header>

<div class="banner"><h2>Elegancia y Diseño</h2></div>

<div class="container"><div id="gallery" class="gallery"></div></div>

<div id="adminPanel" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Nuevo Producto</h3>
        <input id="p_id" type="hidden">
        <input id="p_img" placeholder="URL de la imagen (.jpg o .png)">
        <input id="p_name" placeholder="Nombre del producto">
        <input id="p_price" type="number" placeholder="Precio ($)">
        <button class="btn-add" onclick="guardarProducto()">Guardar en la Nube</button>
        <button style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer; color: #666;" onclick="cerrarModal()">Cancelar</button>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión de Admin</button>
    </div>
</div>

<script>
    // Configuración de Firebase basada en tus datos
    const firebaseConfig = {
        apiKey: "AIzaSyCsPFIJZ5tREVjBIJCLEdad1rVKkQlx9Qo",
        authDomain: "makai-3809b.firebaseapp.com",
        databaseURL: "https://makai-3809b-default-rtdb.firebaseio.com",
        projectId: "makai-3809b",
        storageBucket: "makai-3809b.firebasestorage.app",
        messagingSenderId: "95115227741",
        appId: "1:95115227741:web:ae5644751ced382a4453b4"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Carga de productos en tiempo real
    db.ref('productos').on('value', (snapshot) => {
        const data = snapshot.val();
        const gal = document.getElementById('gallery');
        gal.innerHTML = '';
        const esAdmin = localStorage.getItem('makaiAdmin') === 'true';

        for (let id in data) {
            const p = data[id];
            gal.innerHTML += `
                <div class="card">
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300?text=Imagen+No+Disponible'">
                    <div class="info">
                        <h4>${p.name}</h4>
                        <div class="price">$${parseFloat(p.price).toFixed(2)}</div>
                        <button class="btn-add">Comprar ahora</button>
                    </div>
                    ${esAdmin ? `
                        <div class="admin-controls">
                            <button class="edit-btn" onclick="prepararEdicion('${id}', '${p.name}', '${p.price}', '${p.img}')">Editar</button>
                            <button class="del-btn" onclick="eliminar('${id}')">Borrar</button>
                        </div>` : ''}
                </div>`;
        }
    });

    function guardarProducto() {
        const id = document.getElementById('p_id').value;
        const p = {
            img: document.getElementById('p_img').value,
            name: document.getElementById('p_name').value,
            price: document.getElementById('p_price').value
        };
        if(!p.name || !p.img) return alert("Por favor completa los campos.");

        if(id) {
            db.ref('productos/' + id).set(p); // Actualizar existente
        } else {
            db.ref('productos').push(p); // Crear nuevo
        }
        cerrarModal();
    }

    function prepararEdicion(id, n, p, i) {
        document.getElementById('modalTitle').innerText = "Editar Producto";
        document.getElementById('p_id').value = id;
        document.getElementById('p_name').value = n;
        document.getElementById('p_price').value = p;
        document.getElementById('p_img').value = i;
        document.getElementById('adminPanel').classList.add('active');
    }

    function eliminar(id) {
        if(confirm("¿Estás segura de eliminar este producto?")) {
            db.ref('productos/' + id).remove();
        }
    }

    function verificarAdmin() {
        if(localStorage.getItem('makaiAdmin') === 'true') {
            document.getElementById('modalTitle').innerText = "Nuevo Producto";
            document.getElementById('p_id').value = '';
            document.getElementById('adminPanel').classList.add('active');
        } else {
            const pass = prompt("Clave de Administrador:");
            if(pass === "Makai") {
                localStorage.setItem('makaiAdmin', 'true');
                location.reload();
            } else if (pass !== null) {
                alert("Clave incorrecta");
            }
        }
    }

    function cerrarSesion() {
        localStorage.removeItem('makaiAdmin');
        location.reload();
    }

    function cerrarModal() {
        document.getElementById('adminPanel').classList.remove('active');
    }
</script>
</body>
</html>
