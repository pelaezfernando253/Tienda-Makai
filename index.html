<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Makai – Joyería y Accesorios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary: #111; --accent: #E6005C; --whatsapp: #25D366; --edit: #007bff; --danger: #dc3545; --maps: #4285F4; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #fff; color: #333; }
        
        header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0.8rem 1.5rem; gap: 15px; }
        header h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 1.5rem; }
        .header-search { flex-grow: 1; display: flex; justify-content: center; }
        .search-input { width: 100%; max-width: 350px; padding: 10px 18px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 0.9rem; }

        .banner { height: 180px; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=2070&auto=format&fit=crop') center/cover; display: flex; justify-content: center; align-items: center; color: white; text-align: center; }
        .banner h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; }

        .container { padding: 2rem 1.5rem; max-width: 1200px; margin: auto; min-height: 60vh; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem; }
        
        .card { background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #eee; position: relative; display: flex; flex-direction: column; transition: 0.3s; }
        .card img { width: 100%; height: 320px; object-fit: cover; }
        .badge-discount { position: absolute; top: 12px; left: 12px; background: var(--accent); color: white; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; z-index: 10; }
        
        .info { padding: 1.2rem; text-align: center; flex-grow: 1; }
        .price-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; }
        .price-old { text-decoration: line-through; color: #999; font-size: 0.95rem; }
        .price-new { color: var(--accent); font-weight: 700; font-size: 1.4rem; }
        .price-regular { color: var(--primary); font-weight: 600; font-size: 1.2rem; }

        .btn-add { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 600; }

        .location-float { position: fixed; bottom: 25px; left: 25px; background: var(--maps); color: white; padding: 14px 22px; border-radius: 30px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; z-index: 2000; }
        .cart-float { position: fixed; bottom: 25px; right: 25px; background: var(--whatsapp); color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.8rem; z-index: 2000; }
        #cartCount { font-size: 12px; background: #ff0000; color: white; padding: 2px 7px; border-radius: 50%; position: absolute; top: 5px; right: 5px; border: 2px solid white; font-weight: bold; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 1.8rem; border-radius: 25px; width: 100%; max-width: 480px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 12px; right: 18px; font-size: 2rem; cursor: pointer; color: #999; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .btn-remove-item { color: var(--danger); font-weight: bold; cursor: pointer; padding: 5px 10px; border: 1px solid var(--danger); border-radius: 8px; font-size: 0.8rem; }

        .map-frame { width: 100%; height: 320px; border-radius: 18px; border: 0; margin-top: 15px; }
        .drop-zone { border: 2px dashed #ccc; padding: 25px; text-align: center; border-radius: 15px; cursor: pointer; margin-bottom: 15px; background: #fafafa; }
        #imgPreview { width: 100%; max-height: 180px; object-fit: contain; display: none; margin: 15px auto; }
        input { width: 100%; padding: 12px; margin-bottom: 0.8rem; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-danger { background: var(--danger); color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h1>Makai</h1>
    <div class="header-search"><input type="text" id="searchInput" class="search-input" placeholder="¿Qué buscas?" onkeyup="filtrarProductos()"></div>
    <button onclick="verificarAdmin()" style="background:#f0f0f0; border:none; padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:600;">Admin</button>
</header>

<div class="banner"><h2>Elegancia en cada detalle</h2></div>
<div class="container"><div id="gallery" class="gallery"></div></div>

<div class="location-float" onclick="abrirModalUbicacion()">📍 <span>Tienda Física</span></div>
<div class="cart-float" onclick="abrirModalCarrito()">🛒 <span id="cartCount">0</span></div>

<div id="locationModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="cerrarModalUbicacion()">×</span>
        <h3 style="margin: 0; font-family: 'Playfair Display';">Nuestra Ubicación 📍</h3>
        <iframe src="https://developers.google.com/maps/documentation/embed/embedding-map8" class="map-frame" allowfullscreen="" loading="lazy"></iframe>
        <a href="https://www.google.com/maps/place//data=!3m4!1e2!3m2!1sAF1QipNV-AsUGaaVjBoGZSaXJAPBa-Qf4zlk3NVYrr4e!2e10!4m2!3m1!1s0x8fab578b9adc47dd:0x9f8b83f3ef3162f9" target="_blank" style="text-decoration: none;">
            <button style="width: 100%; margin-top: 15px; background: var(--maps); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer;">Iniciar GPS</button>
        </a>
    </div>
</div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="cerrarModalCarrito()">×</span>
        <h3 style="margin-top:0;">Tu Carrito ✨</h3>
        <div id="cartList"></div>
        <div id="cartTotal" style="margin: 20px 0; font-weight: bold; font-size: 1.2rem; text-align: right; border-top: 2px solid #eee; padding-top: 12px;"></div>
        <button class="btn-add" style="background: var(--whatsapp);" onclick="enviarWhatsApp()">Pedir por WhatsApp</button>
    </div>
</div>

<div id="adminPanel" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="cerrarModalAdmin()">×</span>
        <h3 id="adminTitle">Nuevo Producto</h3>
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()" ondragover="event.preventDefault()" ondrop="manejarDrop(event)">
            <p id="dropText">Sube o arrastra la foto</p>
            <img id="imgPreview">
            <input type="file" id="fileInput" hidden accept="image/*" onchange="convertirImagen(this.files[0])">
        </div>
        <input id="p_id" type="hidden"> <input id="p_img_url" type="hidden">
        <input id="p_name" placeholder="Nombre de la joya">
        <input id="p_price" type="number" placeholder="Precio Original $">
        <input id="p_sale" type="number" placeholder="Precio Oferta $ (Opcional)">
        <button class="btn-add" id="btnGuardar" onclick="guardarProducto()">Publicar Joya</button>
        <hr style="margin: 20px 0; border-top: 1px solid #eee; border-bottom: none;">
        <button class="btn-danger" onclick="cerrarSesion()">CERRAR SESIÓN</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCsPFIJZ5tREVjBIJCLEdad1rVKkQlx9Qo",
        authDomain: "makai-3809b.firebaseapp.com",
        databaseURL: "https://makai-3809b-default-rtdb.firebaseio.com",
        projectId: "makai-3809b",
        storageBucket: "makai-3809b.firebasestorage.app",
        messagingSenderId: "95115227741",
        appId: "1:95115227741:web:ae5644751ced382a4453b4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let productosLocales = [];
    let carrito = [];

    function convertirImagen(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
            document.getElementById('p_img_url').value = reader.result;
            document.getElementById('imgPreview').src = reader.result;
            document.getElementById('imgPreview').style.display = 'block';
            document.getElementById('dropText').style.display = 'none';
        }
        reader.readAsDataURL(file);
    }
    function manejarDrop(e) { e.preventDefault(); convertirImagen(e.dataTransfer.files[0]); }

    db.ref('productos').on('value', (snap) => {
        const data = snap.val(); productosLocales = [];
        for (let id in data) productosLocales.push({ id, ...data[id] });
        renderGaleria(productosLocales);
    });

    function renderGaleria(productos) {
        const gal = document.getElementById('gallery'); gal.innerHTML = '';
        const esAdmin = localStorage.getItem('makaiAdmin') === 'true';
        productos.forEach(p => {
            const desc = p.sale && parseFloat(p.sale) < parseFloat(p.price);
            const pf = desc ? p.sale : p.price;
            gal.innerHTML += `<div class="card">
                ${desc ? `<div class="badge-discount">OFERTA</div>` : ''}
                <img src="${p.img}"><div class="info"><h4>${p.name}</h4>
                <div class="price-container">${desc ? `<span class="price-old">$${p.price}</span><span class="price-new">$${p.sale}</span>` : `<span class="price-regular">$${p.price}</span>`}</div>
                <button class="btn-add" onclick="agregarAlCarrito('${p.name}', ${pf})">Añadir</button></div>
                ${esAdmin ? `
                    <div style="padding:10px; display:flex; gap:5px;">
                        <button onclick="prepararEdicion('${p.id}')" style="flex:1; background:var(--edit); color:white; border:none; padding:8px; border-radius:8px; cursor:pointer; font-weight:bold;">Editar</button>
                        <button onclick="eliminar('${p.id}')" style="flex:1; background:var(--danger); color:white; border:none; padding:8px; border-radius:8px; cursor:pointer; font-weight:bold;">Borrar</button>
                    </div>` : ''}
            </div>`;
        });
    }

    function filtrarProductos() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        renderGaleria(productosLocales.filter(p => p.name.toLowerCase().includes(query)));
    }

    function agregarAlCarrito(n, p) { carrito.push({n, p}); document.getElementById('cartCount').innerText = carrito.length; }

    function abrirModalCarrito() {
        const list = document.getElementById('cartList'); const tot = document.getElementById('cartTotal');
        list.innerHTML = ''; let t = 0;
        if(carrito.length === 0) list.innerHTML = "<p style='text-align:center;'>Vacío</p>";
        else {
            carrito.forEach((item, idx) => {
                t += parseFloat(item.p);
                list.innerHTML += `<div class="cart-item"><span>${item.n} ($${item.p})</span><span class="btn-remove-item" onclick="quitarDelCarrito(${idx})">Eliminar</span></div>`;
            });
            tot.innerText = "Total: $" + t.toFixed(2);
        }
        document.getElementById('cartModal').classList.add('active');
    }

    function quitarDelCarrito(index) {
        carrito.splice(index, 1);
        document.getElementById('cartCount').innerText = carrito.length;
        abrirModalCarrito();
    }

    function enviarWhatsApp() {
        if(carrito.length === 0) return;
        let msg = "¡Hola Makai! Mi pedido:\n\n";
        let total = 0;
        carrito.forEach(i => { msg += `- ${i.n} ($${i.p})\n`; total += parseFloat(i.p); });
        msg += `\n*Total: $${total.toFixed(2)}*`;
        window.open(`https://wa.me/584123580010?text=${encodeURIComponent(msg)}`);
    }

    // FUNCIONES ADMIN: EDITAR Y GUARDAR
    function prepararEdicion(id) {
        const p = productosLocales.find(item => item.id === id);
        document.getElementById('p_id').value = p.id;
        document.getElementById('p_name').value = p.name;
        document.getElementById('p_price').value = p.price;
        document.getElementById('p_sale').value = p.sale || '';
        document.getElementById('p_img_url').value = p.img;
        document.getElementById('imgPreview').src = p.img;
        document.getElementById('imgPreview').style.display = 'block';
        document.getElementById('dropText').style.display = 'none';
        document.getElementById('adminTitle').innerText = "Modificar Joya";
        document.getElementById('btnGuardar').innerText = "Guardar Cambios";
        document.getElementById('adminPanel').classList.add('active');
    }

    function guardarProducto() {
        const id = document.getElementById('p_id').value;
        const p = { 
            img: document.getElementById('p_img_url').value, 
            name: document.getElementById('p_name').value, 
            price: document.getElementById('p_price').value, 
            sale: document.getElementById('p_sale').value 
        };
        if(!p.name || !p.img) return alert("Faltan datos");

        if(id) { // Si hay ID, actualizamos
            db.ref('productos/' + id).set(p);
        } else { // Si no, creamos nuevo
            db.ref('productos').push(p);
        }
        cerrarModalAdmin();
    }

    function verificarAdmin() { 
        if(localStorage.getItem('makaiAdmin') === 'true') {
            document.getElementById('adminTitle').innerText = "Nuevo Producto";
            document.getElementById('btnGuardar').innerText = "Publicar Joya";
            document.getElementById('p_id').value = "";
            document.getElementById('adminPanel').classList.add('active'); 
        } else if(prompt("Clave:") === "Makai") { 
            localStorage.setItem('makaiAdmin', 'true'); location.reload(); 
        } 
    }

    function eliminar(id) { if(confirm("¿Borrar permanentemente?")) db.ref('productos/' + id).remove(); }
    function cerrarSesion() { localStorage.removeItem('makaiAdmin'); location.reload(); }
    function cerrarModalUbicacion() { document.getElementById('locationModal').classList.remove('active'); }
    function cerrarModalCarrito() { document.getElementById('cartModal').classList.remove('active'); }
    function cerrarModalAdmin() { 
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('p_id').value = "";
        document.getElementById('p_name').value = "";
        document.getElementById('p_price').value = "";
        document.getElementById('p_sale').value = "";
        document.getElementById('imgPreview').style.display = 'none';
        document.getElementById('dropText').style.display = 'block';
    }
    function abrirModalUbicacion() { document.getElementById('locationModal').classList.add('active'); }
</script>
</body>
</html>
